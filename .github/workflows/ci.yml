name: CI - Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      # Compila o projeto e roda os testes automatizados.
      # Os testes de integração sobem um PostgreSQL em container (Testcontainers),
      # que já está disponível nos servidores do GitHub Actions.
      - name: Compilar e testar
        run: ./mvnw -B verify

      - name: Guardar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-backend
          path: target/surefire-reports
          if-no-files-found: ignore
